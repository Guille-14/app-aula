<!DOCTYPE html>
<html lang="es" class="dark" data-theme="dark" data-skin="hub">
<head>
  <meta charset="UTF-8" />
  <!-- CSP: la app es 100% local y no incrusta scripts. Se deja margen solo en lo que
       de verdad necesita: estilos en línea (los usa el propio marcado), imágenes y audios
       en data:/blob: (avatares y fotos guardadas en el móvil) y conexión http(s) para el
       chat de Ollama, que apunta al servidor que configures tú. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https:; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Aula SMR — horario, calendario escolar, apuntes y estudio del ciclo. Todo en el móvil, sin nube." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Aula SMR" />
  <title>Aula SMR</title>
  <script src="js/tema.js"></script>
  <link rel="manifest" href="manifest.webmanifest" id="app-manifest" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" id="app-apple-icon" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" id="app-favicon-192" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png" id="app-favicon-512" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/skins.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <!-- ui.css va la última: es la interfaz de verdad (tokens, componentes y vistas) -->
  <link rel="stylesheet" href="css/ui.css" />
</head>
<body class="hub-body">
  <noscript><p style="padding:16px;font-family:sans-serif">Aula SMR necesita JavaScript activado.</p></noscript>
  <a class="skip-link" href="#view">Saltar al contenido</a>
  <span id="brand-course" class="sr-only">SMR</span>
  <span id="card-count" class="sr-only"></span>
  <span id="inbox-count" class="sr-only"></span>

  <main class="phone" id="app">
    <div id="timer-bar" class="timer-bar" hidden>
      <span class="dot" id="timer-bar-dot"></span>
      <strong id="timer-bar-time">25:00</strong>
      <span id="timer-bar-lbl">Estudio</span>
      <button class="btn btn-sm" data-action="go" data-to="timer">Abrir</button>
      <button class="btn btn-sm btn-primary" data-action="timer-toggle" id="timer-bar-btn">Pausa</button>
    </div>

    <header class="hub-header">
      <div class="hub-title-block">
        <h1 id="view-title">Inicio</h1>
        <p id="view-sub">Resumen de tu curso</p>
        <span class="guest-chip" id="guest-chip" hidden>Invitado</span>
      </div>
      <div class="hub-actions">
        <button class="hub-round" data-action="open-cmd" title="Buscar" aria-label="Buscar">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
        </button>
        <button class="hub-round" data-action="toggle-theme" title="Tema" aria-label="Cambiar tema" id="theme-btn">
          <svg id="theme-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5Z"/></svg>
        </button>
        <button class="hub-round hub-avatar" data-action="go" data-to="settings" id="header-avatar" aria-label="Ajustes">A</button>
        <button class="hub-round focus-exit" data-action="toggle-focus" aria-label="Salir del modo foco" title="Salir del modo foco">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </header>

    <div id="view" class="hub-scroll no-scrollbar"></div>
    <div id="a11y-announce" class="sr-only" aria-live="assertive" aria-atomic="true" role="status"></div>

    <nav class="hub-nav" id="bottom-nav" aria-label="Navegación principal">
      <button data-view="dashboard" class="is-active" aria-label="Inicio">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 4 9.5V21h6v-6h4v6h6V9.5L12 3Z"/></svg>
        <span class="nav-lbl">Inicio</span>
      </button>
      <button data-view="schedule" aria-label="Horario">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span class="nav-lbl">Horario</span>
      </button>
      <button type="button" data-action="open-more" aria-label="Más" id="nav-more">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M5 12h14M5 17h10"/></svg>
        <span class="nav-lbl">Más</span>
      </button>
      <button data-view="exams" aria-label="Agenda">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4V3h6v1M8.5 10.5h6M8.5 14.5h4"/></svg>
        <span class="nav-lbl">Agenda</span>
      </button>
      <button data-view="rendimiento" aria-label="Calificaciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h16"/><path d="M8 16v-5M12 16V8M16 16v-3"/></svg>
        <span class="nav-lbl">Notas</span>
      </button>
    </nav>

    <div id="more-sheet" class="sheet" hidden>
      <div class="sheet-card no-scrollbar">
        <div class="sheet-handle"></div>
        <h3>Más</h3>
        <div class="sheet-sec">Taller</div>
        <div class="sheet-grid sheet-wide">
          <button data-view="tools">
            <span class="sheet-ico" style="--c:var(--acc-blue)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M9 12h6"/></svg></span>
            <span class="sheet-txt">Herramientas SMR <small>Subnet, CHMOD, puertos…</small></span>
          </button>
          <button data-view="faltas">
            <span class="sheet-ico" style="--c:var(--acc-red)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9.5 13.5l5 5M14.5 13.5l-5 5"/></svg></span>
            <span class="sheet-txt">Calculadora de faltas <small>¿Cuántas me quedan?</small></span>
          </button>
        </div>
        <div class="sheet-sec">Estudiar</div>
        <div class="sheet-grid">
          <button data-view="timer">
            <span class="sheet-ico" style="--c:var(--acc-amber)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M9 3h6"/></svg></span>
            <span class="sheet-txt">Temporizador <small>Pomodoro</small></span>
          </button>
          <button data-view="cards">
            <span class="sheet-ico" style="--c:var(--acc-violet)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="12" height="16" rx="2"/><path d="M16 7h4v14H8"/></svg></span>
            <span class="sheet-txt">Fichas <small>Repetición</small></span>
          </button>
          <button data-view="quickreview">
            <span class="sheet-ico" style="--c:var(--acc-green)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h16"/><path d="M8 16v-5M12 16V8M16 16v-3"/></svg></span>
            <span class="sheet-txt">Repaso rápido <small>Un módulo a fondo</small></span>
          </button>
          <button data-view="notes">
            <span class="sheet-ico" style="--c:var(--acc-blue)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h6M9 16h6"/></svg></span>
            <span class="sheet-txt">Apuntes <small>Notas del ciclo</small></span>
          </button>
          <button data-view="chatbot">
            <span class="sheet-ico" style="--c:var(--acc-sky)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 6h14v10H8l-3 3V6Z"/><path d="M9 11h6"/></svg></span>
            <span class="sheet-txt">Chat Ollama <small>Tu servidor, tus preguntas</small></span>
          </button>
          <button data-view="examode">
            <span class="sheet-ico" style="--c:var(--acc-rose)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
            <span class="sheet-txt">Concentración <small>Sin distracciones</small></span>
          </button>
          <button data-view="habits">
            <span class="sheet-ico" style="--c:var(--acc-green)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 12l4 4 8-8"/><circle cx="12" cy="12" r="9"/></svg></span>
            <span class="sheet-txt">Hábitos <small>Repaso diario</small></span>
          </button>
        </div>
        <div class="sheet-sec">Organizar</div>
        <div class="sheet-grid">
          <button data-view="agenda">
            <span class="sheet-ico" style="--c:var(--acc-sky)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
            <span class="sheet-txt">Agenda <small>Día / sem / mes</small></span>
          </button>
          <button data-view="inbox">
            <span class="sheet-ico" style="--c:var(--acc-grey)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 13h4l2 3h4l2-3h4v6H4v-6Z"/><path d="M4 13 6.5 5h11L20 13"/></svg></span>
            <span class="sheet-txt">Bandeja <small>Sin clasificar</small></span>
          </button>
          <button data-view="glossary">
            <span class="sheet-ico" style="--c:var(--acc-teal)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3M8 11h6M11 8v6"/></svg></span>
            <span class="sheet-txt">Glosario <small>Términos</small></span>
          </button>
        </div>
        <div class="sheet-sec">Curso</div>
        <div class="sheet-grid">
          <button data-view="subjects">
            <span class="sheet-ico" style="--c:var(--acc-violet)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="13" width="7" height="7" rx="1.5"/><rect x="14" y="13" width="7" height="7" rx="1.5"/></svg></span>
            <span class="sheet-txt">Módulos <small>Los 7 de 2.º</small></span>
          </button>
          <button data-view="achievements">
            <span class="sheet-ico" style="--c:var(--acc-amber)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 4h8v3a4 4 0 0 1-8 0V4Z"/><path d="M8 5H5v2a3 3 0 0 0 3 3M16 5h3v2a3 3 0 0 1-3 3"/><path d="M12 11v3M9 20h6M10 17h4"/></svg></span>
            <span class="sheet-txt">Logros <small>XP y medallas</small></span>
          </button>
        </div>
        <div class="sheet-sec">Sistema</div>
        <div class="sheet-grid">
          <button data-view="settings">
            <span class="sheet-ico" style="--c:var(--acc-grey)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></span>
            <span class="sheet-txt">Ajustes <small>Perfil y avisos</small></span>
          </button>
          <button data-view="admin">
            <span class="sheet-ico" style="--c:var(--acc-grey)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg></span>
            <span class="sheet-txt">Datos locales <small>Copias y estado</small></span>
          </button>
        </div>
        <button class="btn more-capture" data-action="open-capture">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><path d="M12 5v14M5 12h14"/></svg>
          Captura rápida
        </button>
      </div>
    </div>

    <div id="capture" class="cmdk" hidden>
      <div class="cmdk-box capture-box">
        <textarea id="capture-text" rows="4" placeholder="Di o escribe lo que quieras apuntar: «DHCP asigna IP por rango»"></textarea>
        <div class="capture-actions">
          <button class="btn btn-primary" data-action="capture-inbox">Bandeja</button>
          <button class="btn" data-action="capture-note">Nota</button>
          <button class="btn" data-action="nlp-text">Interpretar</button>
          <button class="btn" data-action="voice-fab" id="capture-voice">🎤 Dictar</button>
          <button class="btn btn-ghost" data-action="close-capture">Cerrar</button>
        </div>
      </div>
    </div>

    <div id="cmdk" class="cmdk" hidden>
      <div class="cmdk-box">
        <input id="cmdk-input" placeholder="Buscar notas, módulos, acciones…" autocomplete="off" />
        <div id="cmdk-list"></div>
        <div class="cmdk-hint">↑↓ navegar · Enter abrir · Esc cerrar</div>
      </div>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toasts" role="status" aria-live="polite"></div>
    <div id="overlay" class="overlay" hidden></div>
    <div id="sheet-root"></div>
  </main>

  <script src="js/media.js"></script>
  <script src="js/avisos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/studio.js"></script>
  <!-- js/tools.js NO se carga aquí: son ~56 KB que solo hacen falta si entras en
       «Herramientas SMR». app.js lo pide en ese momento (sigue en el precache, así que
       funciona igual sin conexión). -->
</body>
</html>
