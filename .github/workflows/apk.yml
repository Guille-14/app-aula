name: APK

# Compila el APK firmado y lo publica como Release (descarga directa desde el móvil).
# Se ejecuta al tocar código de la app, en main y en las ramas de trabajo, y a mano.
on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "index.html"
      - "js/**"
      - "css/**"
      - "assets/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "apk-overlay/**"
      - "tools/**"        # el minificador que empaqueta la web del APK
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write        # publicar la release y subir el APK

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (platform 34)
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "SDK listo en $SDK"

      - name: Dependencias (Capacitor y Pillow)
        run: |
          npm install --no-audit --no-fund
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow

      - name: Pruebas antes de empaquetar
        run: |
          # Si algo falla, los fallos se publican como anotaciones: los ficheros de log de
          # Actions viven en un CDN que no siempre es accesible, y así el motivo se ve
          # tanto en la interfaz como por API.
          set -o pipefail
          if npm test 2>&1 | tee test.log; then exit 0; fi
          grep -E "^ *[-✗]|fallos" test.log | head -10 | while IFS= read -r l; do
            echo "::error title=Prueba fallida::$(printf '%s' "$l" | cut -c1-200)"
          done
          exit 1

      - name: Pruebas sobre el código minificado (lo que va dentro del APK)
        run: |
          # Minificar cambia el código (p. ej. terser convierte APP_VERSION = "v63" en
          # APP_VERSION:"v63"), y eso ya tumbó una entrega. Aquí se prueban las mismas
          # comprobaciones sobre la web minificada antes de empaquetarla.
          set -o pipefail
          if npm run test:min 2>&1 | tee test-min.log; then exit 0; fi
          grep -E "^ *[-✗]|fallos" test-min.log | head -10 | while IFS= read -r l; do
            echo "::error title=Prueba sobre el minificado::$(printf '%s' "$l" | cut -c1-200)"
          done
          exit 1

      - name: Compilar el APK
        run: |
          set -o pipefail
          if bash apk-overlay/build.sh 2>&1 | tee build.log; then exit 0; fi
          tail -12 build.log | while IFS= read -r l; do
            echo "::error title=Fallo al compilar::$(printf '%s' "$l" | cut -c1-200)"
          done
          exit 1

      - name: Comprobar el APK (firma, versión y widgets)
        id: comprobar
        run: |
          set -o pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > firma.txt || true
          if python3 apk-overlay/comprobar-apk.py "$APK" firma.txt 2>&1 | tee comprobacion.txt; then
            while IFS= read -r linea; do
              echo "$linea" >> "$GITHUB_OUTPUT"
            done < .datos-apk
          else
            grep -E "FALLO|Traceback|Error" comprobacion.txt | head -10 | while IFS= read -r l; do
              echo "::error title=Comprobación del APK::$(printf '%s' "$l" | cut -c1-200)"
            done
            exit 1
          fi

      - name: Guardar el APK como artefacto (por si la release falla)
        uses: actions/upload-artifact@v7
        with:
          name: Aula-SMR-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publicar la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          TAG="apk-v$VERSION"
          ASSET="Aula-SMR-v$VERSION.apk"
          APK=android/app/build/outputs/apk/release/app-release.apk
          cp "$APK" "$ASSET"
          cp "$APK" "Aula-SMR.apk"          # nombre fijo: un enlace que no cambia nunca
          cat > notas.md <<'EOF'
          APK **firmado** de Aula SMR, compilado desde este repositorio por GitHub Actions.

          - Versión de la web dentro del APK: VERSION_APP · VERSION_WIDGETS widgets ·
            VERSION_MEDIA.
          - Tamaño: VERSION_MB MB · SHA-256 del archivo:
            `VERSION_SHA`
          - Firmado con `VERSION_DN`
            (SHA-256 del certificado: `VERSION_FIRMA`; esquemas de firma: VERSION_ESQUEMAS).
          - Paquete `es.aula.smr.hub`. Funciona **sin conexión**: no hay servidor ni cuentas.
            El asistente responde en local y solo usa tu Ollama si le pones la dirección en
            Ajustes → Datos locales.

          **Para instalar:** descarga el `.apk` y ábrelo. Si Android avisa de «apps
          desconocidas», permite la instalación para el navegador o el gestor de archivos.
          Si dice **conflicto de paquete**, tienes otro Aula SMR con otra firma: desinstálala
          antes (exporta tu copia JSON desde Ajustes y no pierdes nada).

          Enlace fijo a la última versión: `/releases/latest/download/Aula-SMR.apk`
          EOF
          sed -i \
            -e "s|VERSION_APP|${{ steps.comprobar.outputs.app }}|" \
            -e "s|VERSION_WIDGETS|${{ steps.comprobar.outputs.widgets }}|" \
            -e "s|VERSION_MEDIA|media.js: ${{ steps.comprobar.outputs.media }}|" \
            -e "s|VERSION_MB|${{ steps.comprobar.outputs.mb }}|" \
            -e "s|VERSION_SHA|${{ steps.comprobar.outputs.sha }}|" \
            -e "s|VERSION_DN|${{ steps.comprobar.outputs.firma_dn }}|" \
            -e "s|VERSION_FIRMA|${{ steps.comprobar.outputs.firma }}|" \
            -e "s|VERSION_ESQUEMAS|${{ steps.comprobar.outputs.esquemas }}|" \
            -e "s|VERSION_COMMIT|${GITHUB_SHA:0:7}|" \
            notas.md
          echo "" >> notas.md
          echo "Compilado desde el commit \`${GITHUB_SHA:0:7}\`." >> notas.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "Aula-SMR.apk" --clobber
            gh release edit "$TAG" --latest --title "Aula SMR v$VERSION · APK" --notes-file notas.md
          else
            gh release create "$TAG" "$ASSET" "Aula-SMR.apk" \
              --target "$GITHUB_SHA" \
              --title "Aula SMR v$VERSION · APK" \
              --notes-file notas.md \
              --latest
          fi
          echo "Release: $(gh release view "$TAG" --json url -q .url)"
