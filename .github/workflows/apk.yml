name: APK

# Compila el APK firmado y lo publica como Release (descarga directa desde el móvil).
# Se ejecuta al tocar código de la app, en main y en las ramas de trabajo, y a mano.
on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "index.html"
      - "js/**"
      - "css/**"
      - "assets/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "apk-overlay/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write        # publicar la release y subir el APK

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (platform 34)
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "SDK listo en $SDK"

      - name: Dependencias (Capacitor y Pillow)
        run: |
          npm install --no-audit --no-fund
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow

      - name: Pruebas antes de empaquetar
        run: npm test

      - name: Compilar el APK
        run: bash apk-overlay/build.sh

      - name: Comprobar el APK (firma, versión y widgets)
        id: comprobar
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK" | tee firma.txt

          python3 - "$APK" <<'PY'
          import hashlib, os, re, sys, zipfile
          apk = sys.argv[1]

          # --- lo que dice la firma ---
          firma = open("firma.txt", encoding="utf-8", errors="ignore").read()
          def tras(etiqueta, texto):
              m = re.search(re.escape(etiqueta) + r"[:\s]*([^\n]+)", texto)
              return m.group(1).strip() if m else ""
          dn = tras("certificate DN", firma)
          digest = ""
          for linea in firma.splitlines():
              if "certificate SHA-256 digest" in linea:
                  cola = linea.split(":")[-1].strip()
                  if re.fullmatch(r"[0-9a-fA-F]{64}", cola):
                      digest = cola.lower()
                      break
          esquemas = ",".join(re.findall(r"Verified using (v\d) scheme[^:]*: true", firma))

          # --- lo que va dentro del APK ---
          z = zipfile.ZipFile(apk)
          nombres = z.namelist()
          app = z.read("assets/public/js/app.js").decode("utf-8", "ignore")
          ver = (re.search(r'APP_VERSION\s*=\s*"(v\d+)"', app) or [None, "?"])[1]
          widgets = z.read("AndroidManifest.xml").count(b"APPWIDGET_UPDATE")
          media = "assets/public/js/media.js" in nombres

          sha = hashlib.sha256(open(apk, "rb").read()).hexdigest()
          mb = "%.1f" % (os.path.getsize(apk) / 1048576)

          filas = {
              "sha": sha, "mb": mb, "firma": digest, "firma_dn": dn,
              "esquemas": esquemas, "app": ver, "widgets": widgets, "media": "sí" if media else "NO",
          }
          with open(".datos-apk", "w", encoding="utf-8") as f:
              for k, v in filas.items():
                  f.write("%s=%s\n" % (k, v))
          print("--- resumen del APK ---")
          for k, v in filas.items():
              print("  %-10s %s" % (k, v))

          assert re.fullmatch(r"[0-9a-f]{64}", digest or ""), "no he podido leer el certificado"
          assert ver != "?", "no encuentro la versión de la app dentro del APK"
          assert widgets >= 24, "faltan widgets en el APK (%s)" % widgets
          assert media, "falta js/media.js dentro del APK"
          PY

          while IFS= read -r linea; do
            echo "${linea%%=*}=${linea#*=}" >> "$GITHUB_OUTPUT"
          done < .datos-apk

      - name: Guardar el APK como artefacto (por si la release falla)
        uses: actions/upload-artifact@v7
        with:
          name: Aula-SMR-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publicar la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          TAG="apk-v$VERSION"
          ASSET="Aula-SMR-v$VERSION.apk"
          APK=android/app/build/outputs/apk/release/app-release.apk
          cp "$APK" "$ASSET"
          cp "$APK" "Aula-SMR.apk"          # nombre fijo: un enlace que no cambia nunca
          cat > notas.md <<'EOF'
          APK **firmado** de Aula SMR, compilado desde este repositorio por GitHub Actions.

          - Versión de la web dentro del APK: VERSION_APP · VERSION_WIDGETS widgets ·
            VERSION_MEDIA.
          - Tamaño: VERSION_MB MB · SHA-256 del archivo:
            `VERSION_SHA`
          - Firmado con `VERSION_DN`
            (SHA-256 del certificado: `VERSION_FIRMA`; esquemas de firma: VERSION_ESQUEMAS).
          - Paquete `es.aula.smr.hub`. Funciona **sin conexión**: no hay servidor ni cuentas.
            El asistente responde en local y solo usa tu Ollama si le pones la dirección en
            Ajustes → Datos locales.

          **Para instalar:** descarga el `.apk` y ábrelo. Si Android avisa de «apps
          desconocidas», permite la instalación para el navegador o el gestor de archivos.
          Si dice **conflicto de paquete**, tienes otro Aula SMR con otra firma: desinstálala
          antes (exporta tu copia JSON desde Ajustes y no pierdes nada).

          Enlace fijo a la última versión: `/releases/latest/download/Aula-SMR.apk`
          EOF
          sed -i \
            -e "s|VERSION_APP|${{ steps.comprobar.outputs.app }}|" \
            -e "s|VERSION_WIDGETS|${{ steps.comprobar.outputs.widgets }}|" \
            -e "s|VERSION_MEDIA|media.js: ${{ steps.comprobar.outputs.media }}|" \
            -e "s|VERSION_MB|${{ steps.comprobar.outputs.mb }}|" \
            -e "s|VERSION_SHA|${{ steps.comprobar.outputs.sha }}|" \
            -e "s|VERSION_DN|${{ steps.comprobar.outputs.firma_dn }}|" \
            -e "s|VERSION_FIRMA|${{ steps.comprobar.outputs.firma }}|" \
            -e "s|VERSION_ESQUEMAS|${{ steps.comprobar.outputs.esquemas }}|" \
            -e "s|VERSION_COMMIT|${GITHUB_SHA:0:7}|" \
            notas.md
          echo "" >> notas.md
          echo "Compilado desde el commit \`${GITHUB_SHA:0:7}\`." >> notas.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "Aula-SMR.apk" --clobber
            gh release edit "$TAG" --latest --title "Aula SMR v$VERSION · APK" --notes-file notas.md
          else
            gh release create "$TAG" "$ASSET" "Aula-SMR.apk" \
              --target "$GITHUB_SHA" \
              --title "Aula SMR v$VERSION · APK" \
              --notes-file notas.md \
              --latest
          fi
          echo "Release: $(gh release view "$TAG" --json url -q .url)"
