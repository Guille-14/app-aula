name: APK

# Compila el APK firmado y lo publica como Release (descarga directa desde el móvil).
# Se ejecuta al tocar código de la app, en main y en las ramas de trabajo, y a mano.
on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "index.html"
      - "js/**"
      - "css/**"
      - "assets/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "apk-overlay/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write        # publicar la release y subir el APK

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (platform 34)
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "SDK listo en $SDK"

      - name: Dependencias (Capacitor y Pillow)
        run: |
          npm install --no-audit --no-fund
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow

      - name: Pruebas antes de empaquetar
        run: npm test

      - name: Compilar el APK
        run: bash apk-overlay/build.sh

      - name: Comprobar el APK (firma y contenido)
        id: comprobar
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK" | tee firma.txt
          echo "sha=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "mb=$(awk "BEGIN{printf \"%.1f\", $(stat -c%s "$APK")/1048576}")" >> "$GITHUB_OUTPUT"
          echo "firma=$(awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}' firma.txt)" >> "$GITHUB_OUTPUT"
          echo "firma_dn=$(awk -F': ' '/certificate DN/ {print $2; exit}' firma.txt)" >> "$GITHUB_OUTPUT"
          echo "esquemas=$(grep -c 'Verified using' firma.txt)" >> "$GITHUB_OUTPUT"
          # Qué se ha empaquetado de verdad (versión de la app y widgets dentro del APK)
          unzip -q -o "$APK" "assets/public/js/app.js" "assets/public/js/media.js" -d comprobado
          VER=$(grep -o 'APP_VERSION = \"v[0-9]*\"' comprobado/assets/public/js/app.js | head -1)
          WID=$(unzip -l "$APK" | grep -c "res/xml/widget_")
          echo "app=$(echo "$VER" | grep -o 'v[0-9]*')" >> "$GITHUB_OUTPUT"
          echo "widgets=$WID" >> "$GITHUB_OUTPUT"
          echo "--- resumen ---"
          echo "versión dentro del APK: $VER"
          echo "widgets empaquetados: $WID"
          test -n "$VER" && test "$WID" -ge 24

      - name: Guardar el APK como artefacto (por si la release falla)
        uses: actions/upload-artifact@v7
        with:
          name: Aula-SMR-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publicar la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          TAG="apk-v$VERSION"
          ASSET="Aula-SMR-v$VERSION.apk"
          APK=android/app/build/outputs/apk/release/app-release.apk
          cp "$APK" "$ASSET"
          cp "$APK" "Aula-SMR.apk"          # nombre fijo: enlace que no cambia nunca
          cat > notas.md <<EOF
          APK **firmado** de Aula SMR $VERSION, compilado desde este repositorio.

          - Tamaño: ${{ steps.comprobar.outputs.mb }} MB · SHA-256 del archivo: \`${{ steps.comprobar.outputs.sha }}\`
          - Firmado con \`${{ steps.comprobar.outputs.firma_dn }}\` (SHA-256: \`${{ steps.comprobar.outputs.firma }}\`)
          - Paquete \`es.aula.smr.hub\` · versión ${{ steps.comprobar.outputs.app }} dentro del APK · ${{ steps.comprobar.outputs.widgets }} widgets empaquetados.
          - Todo funciona sin conexión: no hay servidor ni cuentas. El asistente responde en local
            (y usa tu Ollama solo si le pones la dirección en Ajustes → Datos locales).

          **Para instalar:** descarga el \`.apk\` y ábrelo. Si Android avisa de «apps desconocidas»,
          permite la instalación para el navegador o el gestor de archivos que use.
          Si dice **conflicto de paquete**, es porque tienes otro Aula SMR con otra firma:
          desinstálala antes (exporta antes tu copia JSON desde Ajustes → no se pierde nada).

          Compilado desde el commit \`${GITHUB_SHA:0:7}\`.
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "Aula-SMR.apk" --clobber
            gh release edit "$TAG" --latest --title "Aula SMR v$VERSION · APK" --notes-file notas.md
          else
            gh release create "$TAG" "$ASSET" "Aula-SMR.apk" \
              --target "$GITHUB_SHA" \
              --title "Aula SMR v$VERSION · APK" \
              --notes-file notas.md \
              --latest
          fi
          echo "Release: $(gh release view "$TAG" --json url -q .url)"
